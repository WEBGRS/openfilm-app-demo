<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  #bg { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="bg"></div>
<script type="module">
const bg = document.getElementById('bg');
function frame(t) {
  const a = 30 + 12 * Math.sin(t * 0.35);
  const b = 70 + 10 * Math.cos(t * 0.27);
  bg.style.background = `radial-gradient(circle at ${a}% ${b}%, #3b45a8 0%, #1b1f4a 45%, #0d0f24 100%)`;
}
window.film = { frame };
if (!window.filmHost) { const t0 = performance.now(); const loop = () => { frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; loop(); }
</script>
</body>
</html>
